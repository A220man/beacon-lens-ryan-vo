name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt

      - name: Run backend tests
        run: |
          . .venv/bin/activate
          PYTHONPATH=. pytest tests -v --cov=app --cov-report=term-missing

      - name: Run type check
        run: |
          . .venv/bin/activate
          mypy app

      - name: Run lint
        run: |
          . .venv/bin/activate
          ruff check app tests

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run build  # tsc runs as part of build

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npx eslint src --ext ts,tsx --max-warnings 0

  backend-docker:
    runs-on: ubuntu-latest
    needs: backend-test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
          load: true

  frontend-docker:
    runs-on: ubuntu-latest
    needs: frontend-test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
          load: true

  compose-test:
    runs-on: ubuntu-latest
    needs: [backend-docker, frontend-docker]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Start compose stack
        run: |
          docker compose up -d --build backend frontend keycloak keycloak-db
          sleep 30

      - name: Test backend health
        run: |
          curl -f http://localhost:8000/health

      - name: Test frontend
        run: |
          curl -f http://localhost:3000

      - name: Shutdown
        run: docker compose down -v